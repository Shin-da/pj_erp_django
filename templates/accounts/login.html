{% extends "base_auth.html" %}
{% block title %}Sign in — Perfect Jewel ERP{% endblock %}
{% block content %}
<div class="panel" style="width:min(420px,100%);">
  <h1>Perfect Jewel ERP — Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</div>
{% endblock %}
